<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог - FlowerArt</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header" id="header-container">
        
    </header>

    <main class="container">
        <h1>Каталог цветов</h1>
        
        <div class="catalog-layout">
            <aside class="filters">
                <h3>Фильтры</h3>
                
                <div class="filter-group">
                    <h4>Категория</h4>
                    <label><input type="checkbox" name="category" value="rose"> Розы</label>
                    <label><input type="checkbox" name="category" value="carnations"> Гвоздики</label>
                    <label><input type="checkbox" name="category" value="chrysanthemums"> Хризантемы</label>
                    <label><input type="checkbox" name="category" value="dahlias"> Георгины</label>
                    <label><input type="checkbox" name="category" value="chamomiles"> Ромашки</label>
                    <label><input type="checkbox" name="category" value="gerberas"> Герберы</label>
                </div>

                <div class="filter-group">
                    <h4>Цена</h4>
                    <input type="range" min="0" max="10000" class="price-range">
                    <div class="price-values">
                        <span>0 ₽</span>
                        <span>10000 ₽</span>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Цвет</h4>
                    <div class="color-filters">
                        <span class="color-dot" style="background: #dc2626" data-color="red" title="Красный"></span>
                        <span class="color-dot" style="background: #fbbf24" data-color="yellow" title="Желтый"></span>
                        <span class="color-dot" style="background: #ec4899" data-color="pink" title="Розовый"></span>
                        <span class="color-dot" style="background: #ffffff; border: 1px solid #ddd" data-color="white" title="Белый"></span>
                        <span class="color-dot" style="background: #a855f7" data-color="purple" title="Фиолетовый"></span>
                        <span class="color-dot" style="background: #f97316" data-color="orange" title="Оранжевый"></span>
                        <span class="color-dot" style="background: #3b82f6" data-color="blue" title="Синий"></span>
                        <span class="color-dot" style="background: #1f2937" data-color="black" title="Черный"></span>
                    </div>
                </div>
            </aside>

            <div class="products-section">
                <div class="products-header">
                    <p>Найдено товаров: <span id="products-count">0</span></p>
                    <select class="sort-select">
                        <option value="popular">По популярности</option>
                        <option value="price-asc">Сначала дешевые</option>
                        <option value="price-desc">Сначала дорогие</option>
                        <option value="name">По названию</option>
                    </select>
                </div>

                <div class="products-grid" id="products-grid">
                    
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer-container">
    </footer>

</body>
<script type="module" src="../js/main.js"></script>
</html>
